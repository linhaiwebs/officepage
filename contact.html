<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | AIMAXS</title>
<meta name="description" content="AIMAXSへのお問い合わせはこちらから。ご質問・ご意見をお気軽にお寄せください。">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a12;
  --card-bg:#12121f;
  --card-border:#1e1e35;
  --green:#00ff66;
  --text:#c8ccd6;
  --text-dim:#8b8b9e;
  --heading:#e8eaf0;
  --white:#f0f0f5;
  --font-mono:"Courier New","MS Gothic","Osaka-Mono",monospace;
  --font-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --max-w:800px;
}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--font-sans);
  color:var(--text);
  background:var(--bg);
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::after{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);
  pointer-events:none;z-index:9999;
}
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:20px 20px;
}

.page-header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,18,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.header-inner{
  max-width:var(--max-w);margin:0 auto;padding:0 24px;
  height:64px;display:flex;align-items:center;justify-content:space-between;
}
.site-logo{
  font-family:var(--font-mono);font-size:1.15rem;font-weight:700;
  color:var(--green);text-decoration:none;letter-spacing:.06em;
}
.back-link{
  font-size:.82rem;color:var(--text-dim);text-decoration:none;
  font-family:var(--font-mono);transition:color .2s;
}
.back-link:hover{color:var(--green)}

.page-content{max-width:var(--max-w);margin:0 auto;padding:60px 24px;position:relative;z-index:2}
.page-content h1{
  font-family:var(--font-mono);font-size:1.5rem;color:var(--green);
  margin-bottom:8px;letter-spacing:.04em;
}
.page-content .subtitle{font-size:.82rem;color:var(--text-dim);margin-bottom:40px}

.contact-form{max-width:560px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--heading);margin-bottom:6px}
.form-group .required{color:var(--green);font-family:var(--font-mono)}
.form-group input,.form-group textarea{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--card-border);
  border-radius:6px;font-size:.9rem;font-family:var(--font-sans);
  color:var(--text);background:var(--card-bg);
  transition:border-color .2s,box-shadow .2s;
}
.form-group textarea{min-height:140px;resize:vertical}
.form-group input:focus,.form-group textarea:focus{
  outline:none;border-color:var(--green);
  box-shadow:0 0 0 3px rgba(0,255,102,.1);
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 32px;border-radius:6px;
  font-size:.85rem;font-family:var(--font-mono);font-weight:600;
  cursor:pointer;border:none;
  transition:all .25s;
  background:var(--green);color:var(--bg);
}
.btn:hover{background:var(--green-dim);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,255,102,.2)}
.btn:disabled{opacity:.5;pointer-events:none}

.success-msg{display:none;background:rgba(0,255,102,.08);border:1px solid rgba(0,255,102,.2);border-radius:6px;padding:20px 24px;margin-top:24px}
.success-msg.visible{display:block}
.success-msg p{font-size:.85rem;color:var(--green)}

@media(max-width:640px){
  .page-content{padding:40px 20px}
  .page-content h1{font-size:1.25rem}
}
</style>
</head>
<body>

<div class="bg-grid"></div>

<header class="page-header">
  <div class="header-inner">
    <a href="index.html" class="site-logo">&gt; AIMAXS</a>
    <a href="index.html" class="back-link">&larr; トップに戻る</a>
  </div>
</header>

<main class="page-content">
  <h1>&gt; お問い合わせ</h1>
  <p class="subtitle">ご質問やご意見がございましたら、以下のフォームよりお気軽にお寄せください。</p>

  <form class="contact-form" id="contactForm">
    <div class="form-group">
      <label for="name">お名前 <span class="required">*</span></label>
      <input type="text" id="name" name="name" required placeholder="例：山田 太郎">
    </div>
    <div class="form-group">
      <label for="email">メールアドレス <span class="required">*</span></label>
      <input type="email" id="email" name="email" required placeholder="例：taro@example.com">
    </div>
    <div class="form-group">
      <label for="subject">件名</label>
      <input type="text" id="subject" name="subject" placeholder="お問い合わせ内容の概要">
    </div>
    <div class="form-group">
      <label for="message">お問い合わせ内容 <span class="required">*</span></label>
      <textarea id="message" name="message" required placeholder="お問い合わせ内容を入力してください"></textarea>
    </div>
    <button type="submit" class="btn" id="submitBtn">&gt; 送信する</button>
    <div class="success-msg" id="successMsg">
      <p>&gt; お問い合わせを受け付けました。内容を確認の上、2〜3営業日以内にご連絡いたします。</p>
    </div>
  </form>
</main>

<script>
document.getElementById('contactForm').addEventListener('submit',function(e){
  e.preventDefault();
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '> 送信中...';
  setTimeout(function(){
    document.getElementById('contactForm').style.display = 'none';
    document.getElementById('successMsg').classList.add('visible');
  }, 800);
});
</script>

</body>
</html>
